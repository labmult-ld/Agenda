        .google-calendar-container { position: relative; width: 100%; padding-top: 75%; }

        const selectElement = document.getElementById('equipamento-select');
        const calendarIframe = document.getElementById('calendar-iframe');

        Object.keys(calendars).slice(1).forEach(name => {
            const option = document.createElement('option');
            option.value = name;
            option.textContent = name;
            selectElement.appendChild(option);
        });

        function updateCalendar() {
            const selectedEquipmentName = selectElement.value;
            let newUrl = "";
            
            if (selectedEquipmentName === "todos") {
                newUrl = calendars.todos;
            } else {
                const calendarInfo = calendars[selectedEquipmentName];
                const baseUrl = "https://calendar.google.com/calendar/embed?";
                const params = new URLSearchParams({
                    src: calendarInfo.id,
                    color: calendarInfo.color, // <-- Adicionado o parâmetro da cor
                    ctz: "America/Sao_Paulo",
                    hl: "pt_BR",
                    showTitle: 0,
                    showNav: 1,
                    showDate: 1,
                    showPrint: 0,
                    showTabs: 1,
                    showCalendars: 0,
                    showTz: 0
                });
                newUrl = baseUrl + params.toString();
            }
            calendarIframe.src = newUrl;
        }

        selectElement.addEventListener('change', updateCalendar);
